<head>

    <style>
        :root {
            --fg: #00ff00;
            --bg: #1e1e1e;
            --prompt: #ff0000;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;               /* page never overflows */
            background-color: var(--bg);
            color: var(--fg);
            font-family: monospace;
        }
        body {
            /* Fixed to the visible viewport on both laptop & mobile.
               Layered fallbacks so it adapts to ANY device/browser:
               1) 100vh          -> universal baseline
               2) --vh JS var    -> older mobile browsers without dvh support
               3) 100dvh         -> modern browsers (handles mobile toolbars) */
            height: 100vh;                       /* fallback */
            height: calc(var(--vh, 1vh) * 100);  /* JS-measured real height */
            height: 100dvh;                      /* best, where supported */
            display: flex;
            flex-direction: column;
            padding: clamp(8px, 2.5vw, 16px);    /* padding scales with device */
        }
        h1 {
            flex: 0 0 auto;
            margin: 0 0 8px 0;
            font-size: clamp(14px, 4vw, 22px);
            word-break: break-word;
        }
        #terminal {
            flex: 1 1 auto;
            min-height: 0;                  /* allow inner scroll in flexbox */
            display: flex;
            flex-direction: column;
        }
        #output {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;               /* boot text scrolls INSIDE, screen stays fixed */
            overflow-x: hidden;
            font-size: clamp(11px, 3vw, 15px);
            line-height: 1.4;
            -webkit-overflow-scrolling: touch;
        }
        #output p, #output div { margin: 0 0 2px 0; word-break: break-word; }
        #output ul { margin: 4px 0; padding-left: 18px; }
        #output pre { margin: 0; white-space: pre-wrap; word-break: break-word; }
        .bl { color: #4aa3ff; }
        .gn { color: #00ff00; }

        #input-line {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            visibility: hidden;
            font-size: clamp(11px, 3vw, 15px);
            padding-top: 4px;
        }
        #prompt { margin-right: 6px; color: var(--prompt); white-space: nowrap; }
        #input {
            background: none;
            border: none;
            color: var(--fg);
            width: 100%;
            outline: none;
            font-family: monospace;
            font-size: inherit;
            caret-color: var(--fg);
        }

        /* ---------- Device-adaptive breakpoints ---------- */

        /* Large workstations / wide monitors: cap width & center for readability */
        @media (min-width: 1000px) {
            body { max-width: 1100px; margin: 0 auto; padding: 20px; }
            h1        { font-size: 22px; }
            #output   { font-size: 15px; }
            #input-line { font-size: 15px; }
        }

        /* Small phones: tighter spacing, larger touch-friendly input */
        @media (max-width: 480px) {
            body { padding: 8px; }
            h1        { font-size: 15px; }
            #output   { font-size: 12px; line-height: 1.35; }
            #input-line { font-size: 13px; }   /* >=13px avoids iOS auto-zoom feel */
        }

        /* Landscape on short screens (e.g. phone rotated): reclaim vertical space */
        @media (max-height: 450px) and (orientation: landscape) {
            h1 { margin-bottom: 4px; font-size: 14px; }
            body { padding: 6px 10px; }
            #output { line-height: 1.25; }
        }
    </style>
</head>
