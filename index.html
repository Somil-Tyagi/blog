<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hello World!</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        :root {
            --fg: #00ff00;
            --bg: #1e1e1e;
            --prompt: #ff0000;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;               /* page never overflows */
            background-color: var(--bg);
            color: var(--fg);
            font-family: monospace;
        }
        body {
            /* Fixed to the visible viewport on both laptop & mobile.
               Layered fallbacks so it adapts to ANY device/browser:
               1) 100vh          -> universal baseline
               2) --vh JS var    -> older mobile browsers without dvh support
               3) 100dvh         -> modern browsers (handles mobile toolbars) */
            height: 100vh;                       /* fallback */
            height: calc(var(--vh, 1vh) * 100);  /* JS-measured real height */
            height: 100dvh;                      /* best, where supported */
            display: flex;
            flex-direction: column;
            padding: clamp(8px, 2.5vw, 16px);    /* padding scales with device */
        }
        h1 {
            flex: 0 0 auto;
            margin: 0 0 8px 0;
            font-size: clamp(14px, 4vw, 22px);
            word-break: break-word;
        }
        #terminal {
            flex: 1 1 auto;
            min-height: 0;                  /* allow inner scroll in flexbox */
            display: flex;
            flex-direction: column;
        }
        #output {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;               /* boot text scrolls INSIDE, screen stays fixed */
            overflow-x: hidden;
            font-size: clamp(11px, 3vw, 15px);
            line-height: 1.4;
            -webkit-overflow-scrolling: touch;
        }
        #output p, #output div { margin: 0 0 2px 0; word-break: break-word; }
        #output ul { margin: 4px 0; padding-left: 18px; }
        #output pre { margin: 0; white-space: pre-wrap; word-break: break-word; }
        .bl { color: #4aa3ff; }
        .gn { color: #00ff00; }

        /* Matrix rain canvas (toggled by the 'matrix' command) */
        #matrix {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            background: #000;
        }
        #matrix.on { display: block; }
        .matrix-hint {
            position: fixed;
            bottom: 12px; left: 0; right: 0;
            z-index: 10000;
            text-align: center;
            color: #00ff00;
            font-family: monospace;
            font-size: 13px;
            pointer-events: none;
            text-shadow: 0 0 6px #00ff00;
        }

        /* ---------- CrowdStrike RTR-style bordered input dock ----------
           Submit works BOTH ways: press Enter OR click "Run command". */
        #input-line {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 8px;
            visibility: hidden;
            margin-top: 10px;
            padding: 10px 12px;
            font-size: clamp(11px, 3vw, 15px);
            background: #141414;
            border: 1px solid #2a5d2a;                 /* subtle green border */
            border-radius: 8px;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        /* Glow highlight on focus, like the RTR "Enter command" box */
        #input-line.focused {
            border-color: var(--fg);
            box-shadow: 0 0 0 1px var(--fg), 0 0 12px rgba(0, 255, 0, 0.35);
        }
        #prompt { color: var(--prompt); white-space: nowrap; font-weight: bold; }
        #input {
            background: none;
            border: none;
            color: var(--fg);
            flex: 1 1 auto;
            width: 100%;
            outline: none;
            font-family: monospace;
            font-size: inherit;
            caret-color: var(--fg);
        }
        #input::placeholder { color: #3a7a3a; }
        /* "Run command" button (mirrors the RTR console) */
        #run-btn {
            flex: 0 0 auto;
            background: #1b2f1b;
            color: var(--fg);
            border: 1px solid #2a5d2a;
            border-radius: 6px;
            padding: 6px 14px;
            font-family: monospace;
            font-size: inherit;
            cursor: pointer;
            white-space: nowrap;
            transition: background .15s ease, border-color .15s ease;
        }
        #run-btn:hover { background: #244a24; border-color: var(--fg); }
        #run-btn:active { background: #2f602f; }
        @media (max-width: 480px) { #run-btn { padding: 6px 10px; } }

        /* ---------- Device-adaptive breakpoints ---------- */

        /* Large workstations / wide monitors: cap width & center for readability */
        @media (min-width: 1000px) {
            body { max-width: 1100px; margin: 0 auto; padding: 20px; }
            h1        { font-size: 22px; }
            #output   { font-size: 15px; }
            #input-line { font-size: 15px; }
        }

        /* Small phones: tighter spacing, larger touch-friendly input */
        @media (max-width: 480px) {
            body { padding: 8px; }
            h1        { font-size: 15px; }
            #output   { font-size: 12px; line-height: 1.35; }
            #input-line { font-size: 13px; }   /* >=13px avoids iOS auto-zoom feel */
        }

        /* Landscape on short screens (e.g. phone rotated): reclaim vertical space */
        @media (max-height: 450px) and (orientation: landscape) {
            h1 { margin-bottom: 4px; font-size: 14px; }
            body { padding: 6px 10px; }
            #output { line-height: 1.25; }
        }
    </style>
</head>

            <button id="run-btn" type="button">Run command</button>
        </div>
    </div>

                var resume =

                    "Email: " + pr.email + "\n" +
                    "Experience: " + pr.experience + "\n" +
                    "Skills: " + pr.skills + "\n" +

                output.innerHTML = "";

                append("<p>Opening LinkedIn profile...</p>");
            } else if (key === "blog") {
                window.open(C.profile.blog, "_blank");
                append("<p>Opening blog website...</p>");
            } else if (key === "date") {
                append("<p>" + escapeHtml(new Date().toString()) + "</p>");
            } else if (key === "banner") {
                append("<pre class='gn'>" + escapeHtml((C.banner || []).join("\n")) + "</pre>");
            } else if (key === "neofetch") {

            } else if (key === "matrix") {

                startMatrix();

                runSendmail(input);
            } else if (key === "sudo" || key.indexOf("sudo ") === 0) {
                append("<p class='gn'>Nice try. This incident will be reported. \uD83D\uDE0F</p>");
            } else if (key === "echo" || key.indexOf("echo ") === 0) {
                append("<p>" + escapeHtml(input.slice(5)) + "</p>");

                append("<p>Command not found: " + escapeHtml(input) +
                       " &mdash; type 'help'.</p>");

                "Certs   : " + p.certs + "\n" +
                "Shell   : " + (C.shell || "") + "\n" +
                "Uptime  : too many all-nighters";
            append("<pre class='gn'>" + escapeHtml(card) + "</pre>");
        }

                      "?subject=" + encodeURIComponent(args.subject || "") +
                      "&body=" + encodeURIComponent(args.body || "");
            /* Trigger the mail client without exposing the address in the DOM */
            var a = document.createElement("a");
            a.href = url;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            append("<p class='gn'>Opening your mail client to send the message... " +
                   "(subject: " + escapeHtml(args.subject || "(none)") + ")</p>");
        }

        function appendList(arr) {
            if (!arr || !arr.length) return;
            var html = "";
            for (var i = 0; i < arr.length; i++) {
                html += "<p>" + escapeHtml(arr[i]) + "</p>";
            }
            append(html);
        }

        /* ---------- interactive input ---------- */
        var runBtn = document.getElementById("run-btn");

        /* command names for Tab-autocomplete */
        var COMMAND_NAMES = ["help", "ls", "whoami", "cat resume.txt", "clear",
                             "connect", "blog", "date", "banner", "neofetch",
                             "matrix", "echo", "sendmail", "sudo"];

        /* command history (up/down arrows) */
        var history = [];
        var histIdx = -1;   /* -1 means "current, not browsing history" */

        function submit() {
            var val = inputEl.value;
            inputEl.value = "";
            if (val.trim() !== "") {
                history.push(val);
                if (history.length > 100) history.shift();
            }
            histIdx = -1;
            handle(val);
        }

        inputEl.addEventListener("keydown", function (e) {
            if (e.key === "Enter") {
                e.preventDefault();
                submit();
            } else if (e.key === "ArrowUp") {
                e.preventDefault();
                if (history.length === 0) return;
                if (histIdx === -1) histIdx = history.length - 1;
                else if (histIdx > 0) histIdx--;
                inputEl.value = history[histIdx];
                moveCaretToEnd();
            } else if (e.key === "ArrowDown") {
                e.preventDefault();
                if (histIdx === -1) return;
                if (histIdx < history.length - 1) {
                    histIdx++;
                    inputEl.value = history[histIdx];
                } else {
                    histIdx = -1;
                    inputEl.value = "";
                }
                moveCaretToEnd();
            } else if (e.key === "Tab") {
                e.preventDefault();
                autocomplete();
            }
        });

        function moveCaretToEnd() {
            var v = inputEl.value; inputEl.value = ""; inputEl.value = v;
        }

        function autocomplete() {
            var cur = inputEl.value.toLowerCase();
            if (!cur) return;
            var matches = COMMAND_NAMES.filter(function (c) {
                return c.indexOf(cur) === 0;
            });
            if (matches.length === 1) {
                inputEl.value = matches[0];
                moveCaretToEnd();
            } else if (matches.length > 1) {
                append("<p class='gn'>" + escapeHtml(matches.join("   ")) + "</p>");
            }
        }

        /* Run button (same action as Enter) */
        runBtn.addEventListener("click", function (e) {
            e.stopPropagation();
            submit();
            inputEl.focus();
        });

        /* focus glow on the input dock */
        inputEl.addEventListener("focus", function () { inputLine.classList.add("focused"); });
        inputEl.addEventListener("blur",  function () { inputLine.classList.remove("focused"); });

        /* keep focus / tap anywhere to focus (mobile friendly) */
        document.addEventListener("click", function () {
            if (inputLine.style.visibility === "visible") inputEl.focus();
        });

        /* ---------- Matrix rain effect ---------- */
        var matrixCanvas = document.getElementById("matrix");
        var matrixTimer = null, matrixHint = null;
        function startMatrix() {
            var ctx = matrixCanvas.getContext("2d");
            function size() {
                matrixCanvas.width = window.innerWidth;
                matrixCanvas.height = window.innerHeight;
            }
            size();
            matrixCanvas.classList.add("on");

            var chars = "アカサタナハマヤラワ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
            var fontSize = 16;
            var columns = Math.floor(matrixCanvas.width / fontSize);
            var drops = [];
            for (var x = 0; x < columns; x++) drops[x] = Math.random() * -50;

            matrixTimer = setInterval(function () {
                ctx.fillStyle = "rgba(0,0,0,0.06)";
                ctx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
                ctx.fillStyle = "#00ff00";
                ctx.font = fontSize + "px monospace";
                for (var i = 0; i < drops.length; i++) {
                    var text = chars[Math.floor(Math.random() * chars.length)];
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                    if (drops[i] * fontSize > matrixCanvas.height && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                }
            }, 45);

            matrixHint = document.createElement("div");
            matrixHint.className = "matrix-hint";
            matrixHint.textContent = "[ press ESC or click to exit the Matrix ]";
            document.body.appendChild(matrixHint);

            window.addEventListener("resize", size);
            document.addEventListener("keydown", matrixEsc);
            matrixCanvas.addEventListener("click", stopMatrix);
        }
        function matrixEsc(e) { if (e.key === "Escape") stopMatrix(); }
        function stopMatrix() {
            if (matrixTimer) { clearInterval(matrixTimer); matrixTimer = null; }
            matrixCanvas.classList.remove("on");
            document.removeEventListener("keydown", matrixEsc);
            matrixCanvas.removeEventListener("click", stopMatrix);
            if (matrixHint && matrixHint.parentNode) matrixHint.parentNode.removeChild(matrixHint);
            matrixHint = null;
            inputEl.focus();
        }

        window.addEventListener("load", function () { runBoot(0); });
    })();
    </script>
</body>
</html>
